services:
  - type: web
    name: logistics-rca-agent
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: LLM_PROVIDER
        value: gemini
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: WEBHOOK_SECRET
        generateValue: true
